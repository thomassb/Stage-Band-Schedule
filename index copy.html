<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Schedule Countdown</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: white;
        }

        /* ===== HEADER ===== */

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 70vh;
            background: #111;
            border-bottom: 3px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .clock {
            font-size: clamp(4rem, 14vw, 10rem);
            font-weight: 900;
            color: #00ff88;
            line-height: 1;
            text-align: center;
        }

        .next-event {
            margin-top: 20px;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            max-width: 90%;
        }

        /* ===== FORM ===== */

        .form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        input,
        button {
            padding: 12px;
            font-size: 1rem;
        }

        input {
            background: #222;
            color: white;
            border: 1px solid #444;
        }

        button {
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .add-btn {
            background: #00aa66;
            color: white;
        }

        .add-btn:hover {
            background: #008855;
        }

        .delete-btn {
            background: #bb2222;
            color: white;
        }

        .delete-btn:hover {
            background: #991111;
        }

        /* ===== TIMELINE ===== */

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 100px;
        }

        .event {
            background: #222;
            border-left: 8px solid #555;
            border-radius: 8px;
            padding: 16px;
        }

        .event.active {
            background: #183324;
            border-left-color: #00ff88;
        }

        .event.changeover {
            background: #3a2b10;
            border-left-color: orange;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .time {
            color: #ccc;
            margin-top: 5px;
        }

        .countdown {
            margin-top: 10px;
        }

        .progress-bar {
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #00ff88;
        }
    </style>
</head>

<body>

    <div class="sticky-header">
        <div class="clock" id="clock">00:00:00</div>
        <div class="next-event" id="nextEvent">No events scheduled</div>
    </div>

    <div class="form">
        <input id="bandName" placeholder="Band Name">
        <input id="eventDate" type="date">
        <input id="startTime" type="time">
        <input id="endTime" type="time">
        <button class="add-btn" onclick="addBand()">Add Band</button>
    </div>

    <div class="timeline" id="timeline"></div>

<script>
    function loadBands() {
    try {
        const raw = JSON.parse(localStorage.getItem('bands') || '[]');

        bands = raw.map(b => {
            return {
                id: b.id || crypto.randomUUID(),
                name: b.name,
                start: b.start,
                end: b.end,
                date: b.date || new Date().toISOString().slice(0,10)
            };
        });

    } catch (e) {
        console.error(e);
        bands = [];
    }
}
loadBands();
let selectedDate = new Date().toISOString().slice(0,10);

function saveBands() {
    localStorage.setItem('bands', JSON.stringify(bands));
}

function dateTimeFrom(date, time) {
    const [h,m] = time.split(':');
    const d = new Date(date + 'T00:00:00');
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), +h, +m);
}

function formatDuration(ms) {
    if (ms < 0) ms = 0;
    const s = Math.floor(ms/1000);
    const h = Math.floor(s/3600);
    const m = Math.floor((s%3600)/60);
    const sec = s%60;
    return `${h}h ${m}m ${sec}s`;
}

function addBand() {
    const name = bandName.value.trim();
    const date = eventDate.value || selectedDate;
    const start = startTime.value;
    const end = endTime.value;

    if (!name || !start || !end) return alert("Fill all fields");

    bands.push({ id: crypto.randomUUID(), name, date, start, end });
    bands.sort((a,b)=> (a.date+a.start).localeCompare(b.date+b.start));

    saveBands();
    render();
}

function buildSchedule() {
    const list = bands.filter(b=>b.date===selectedDate)
        .sort((a,b)=>a.start.localeCompare(b.start));

    const schedule = [];

    for (let i=0;i<list.length;i++) {
        schedule.push({
            type:'band',
            ...list[i]
        });

        const next = list[i+1];
        if (next && list[i].end < next.start) {
            schedule.push({
                type:'changeover',
                title:'Changeover',
                start:list[i].end,
                end:next.start
            });
        }
    }
    return schedule;
}

function render() {
    const timeline = document.getElementById('timeline');
    timeline.innerHTML = '';

    const schedule = buildSchedule();

    schedule.forEach((item,i)=> {
        const div = document.createElement('div');
        div.className = 'event ' + (item.type==='changeover'?'changeover':'');

        div.innerHTML = `
            <div class="event-header">
                <div>
                    <div class="title">${item.name || item.title}</div>
                    <div class="time">${item.start} - ${item.end}</div>
                </div>
            </div>
            <div class="countdown" id="cd-${i}"></div>
            <div class="progress-bar"><div class="progress-fill" id="pf-${i}"></div></div>
        `;

        timeline.appendChild(div);
    });

    update();
}

function update() {
    const now = new Date();
    const schedule = buildSchedule();

    let next = null;
    let nextDiff = null;

    document.getElementById('clock').textContent = now.toLocaleTimeString();

    schedule.forEach((item,i)=> {
        const start = dateTimeFrom(selectedDate,item.start);
        const end = dateTimeFrom(selectedDate,item.end);

        const el = document.getElementById(`cd-${i}`);

        if (now < start) {
            const d = start-now;
            el.textContent = `Starts in ${formatDuration(d)}`;
            if (!nextDiff || d < nextDiff) { next=item; nextDiff=d; }
        }
        else if (now>=start && now<=end) {
            el.textContent = `Live - ends in ${formatDuration(end-now)}`;

            const pct = (now-start)/(end-start);
            const bar = document.getElementById(`pf-${i}`);
            if (bar) bar.style.width = Math.min(100,pct*100)+'%';
        }
        else {
            el.textContent = 'Completed';
            const bar = document.getElementById(`pf-${i}`);
            if (bar) bar.style.width = '100%';
        }
    });

    document.getElementById('nextEvent').textContent =
        next ? `NEXT: ${next.name} (${formatDuration(nextDiff)})` : 'No more events';
}

setInterval(update,1000);

render();
</script>

</body>
</html>
