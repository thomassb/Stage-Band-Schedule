<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Band Schedule Countdown</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
}

/* ===== HEADER ===== */

.sticky-header {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 70vh;

    background: #111;
    border-bottom: 3px solid #333;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.clock {
    font-size: clamp(4rem, 14vw, 10rem);
    font-weight: 900;
    color: #00ff88;
    line-height: 1;
    text-align: center;
}

.next-event {
    margin-top: 20px;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: bold;
    color: #ffd700;
    text-align: center;
    max-width: 90%;
}

#wakelock-status {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #00ff88;
    text-align: center;
    cursor: pointer;
    user-select: none;
    padding: 4px 12px;
    border-radius: 4px;
    transition: color 0.3s;
}

#wakelock-status:hover {
    background: #222;
}

/* ===== FORM ===== */

.form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

input,
button {
    padding: 12px;
    font-size: 1rem;
}

input {
    background: #222;
    color: white;
    border: 1px solid #444;
}

button {
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.add-btn {
    background: #00aa66;
    color: white;
}

.add-btn:hover {
    background: #008855;
}

/* ===== TIMELINE ===== */

.timeline {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 100px;
    padding-left:20px;
    padding-right:20px;
}

.event {
    background: #222;
    border-left: 8px solid #555;
    border-radius: 8px;
    padding: 16px;
    transition: all 0.3s ease;
}

.event.active {
    background: #183324;
    border-left-color: #00ff88;
    transform: scale(1.02);
    box-shadow: 0 0 25px rgba(0,255,136,0.5);
}

.event.active .title {
    font-size: 2.2rem;
}

.event.changeover {
    background: #3a2b10;
    border-left-color: orange;
}

.event.changeover.active {
    background: #5a4118;
    border-left-color: #ffcc00;
}

.event-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.title {
    font-size: 1.5rem;
    font-weight: bold;
}

.time {
    margin-top: 5px;
    color: #ccc;
}

.countdown {
    margin-top: 10px;
    font-size: 1.15rem;
    font-weight: bold;
}

.status-live {
    color: #00ff88;
}

.status-upcoming {
    color: #ffd700;
}

.status-ended {
    color: #888;
}

.delete-btn {
    background: #bb2222;
    color: white;
    padding: 8px 12px;
    margin: 0;
    flex-shrink: 0;
}

.delete-btn:hover {
    background: #991111;
}

.edit-btn {
    background: #2277cc;
    color: white;
    padding: 8px 12px;
    margin: 0;
    flex-shrink: 0;
}

.edit-btn:hover {
    background: #115599;
}

.save-btn {
    background: #00aa66;
    color: white;
    padding: 8px 12px;
    margin: 0;
    flex-shrink: 0;
}

.save-btn:hover {
    background: #008855;
}

.cancel-btn {
    background: #666;
    color: white;
    padding: 8px 12px;
    margin: 0;
    flex-shrink: 0;
}

.cancel-btn:hover {
    background: #444;
}

.edit-fields {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
}

.edit-fields input {
    background: #333;
    color: white;
    border: 1px solid #555;
    padding: 8px;
    border-radius: 4px;
    font-size: 0.95rem;
}

.edit-fields input[type="text"] {
    min-width: 180px;
}

.event-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}

/* ===== PROGRESS BAR ===== */

.progress-bar-container {
    margin-top: 10px;
    height: 8px;
    background: #333;
    border-radius: 4px;
    overflow: hidden;
}

.progress-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
    background: #555;
}

.progress-bar-fill.upcoming {
    background: #ffd700;
}

.progress-bar-fill.live {
    background: #00ff88;
}

.progress-bar-fill.completed {
    background: #666;
}

/* ===== MOBILE ===== */

@media (max-width: 768px) {

    .sticky-header {
        height: 45vh;
    }

    .form {
        flex-direction: column;
    }

    input,
    button {
        width: 100%;
    }

    .event-header {
        flex-direction: row;
    }
}
</style>
</head>
<body>

<div class="sticky-header">
    <div class="clock" id="clock">00:00:00</div>
    <div class="next-event" id="nextEvent">
        No events scheduled
    </div>
    <div id="wakelock-status">
    🔒 Screen Awake
</div>
</div>

<div class="form">
    <input id="bandName" placeholder="Band Name">
    <input id="startTime" type="time">
    <input id="endTime" type="time">
    <button class="add-btn" onclick="addBand()">Add Band</button>
</div>

<div class="timeline" id="timeline"></div>

<script>

let bands = JSON.parse(localStorage.getItem('bands') || '[]');

let currentActiveIndex = -1;

/* ===== STORAGE ===== */

function saveBands() {
    localStorage.setItem('bands', JSON.stringify(bands));
}

/* ===== UTILITIES ===== */
let wakeLock = null;
let wakeLockVideo = null;

function updateWakeLockStatus() {
    const el = document.getElementById('wakelock-status');
    if (wakeLock || wakeLockVideo) {
        el.innerHTML = '🔒 Screen Awake';
        el.style.color = '#00ff88';
    } else {
        el.innerHTML = '⚠️ Screen May Sleep — Tap to re-enable';
        el.style.color = '#ff6644';
    }
}

async function requestWakeLockAPI() {
    try {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('Wake Lock active');

        wakeLock.addEventListener('release', () => {
            console.log('Wake Lock released by system');
            wakeLock = null;
            updateWakeLockStatus();
            // Try to re-acquire immediately
            requestWakeLockAPI();
        });

        updateWakeLockStatus();
        return true;
    } catch (err) {
        console.warn('Wake Lock API failed:', err.message);
        wakeLock = null;
        updateWakeLockStatus();
        return false;
    }
}

function startVideoFallback() {
    // Some systems ignore the Wake Lock API but respond to video playback
    if (wakeLockVideo) return;

    const video = document.createElement('video');
    video.id = 'wakelock-video';
    video.muted = true;
    video.playsInline = true;
    video.loop = true;
    video.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMWlzb28AAAAQaXNvbQAAAAEAAAAQAAAAAQAAABhpc29tAAAAAgAAAAEAABhpc29tAAAAAwAAABhpc29tAAAABAAAAAEAAAAY';
    video.style.cssText = 'position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1;';
    video.setAttribute('playsinline', '');
    video.setAttribute('muted', '');

    video.play().then(() => {
        wakeLockVideo = video;
        document.body.appendChild(video);
        console.log('Video fallback active');
        updateWakeLockStatus();
    }).catch(err => {
        console.warn('Video fallback failed:', err.message);
        wakeLockVideo = null;
        updateWakeLockStatus();
    });
}

function stopVideoFallback() {
    if (wakeLockVideo) {
        wakeLockVideo.pause();
        wakeLockVideo.remove();
        wakeLockVideo = null;
        updateWakeLockStatus();
    }
}

async function enableWakeLock() {
    // Try the Wake Lock API first
    const apiOk = await requestWakeLockAPI();

    // If API failed or isn't supported, fall back to video
    if (!apiOk && !wakeLockVideo) {
        startVideoFallback();
    }
}

// Keep the wake lock alive with a periodic heartbeat
setInterval(async () => {
    if (document.visibilityState === 'visible') {
        if (!wakeLock && !wakeLockVideo) {
            console.log('Heartbeat: re-acquiring wake lock');
            await enableWakeLock();
        }
    }
}, 30000);

// Re-acquire when the tab becomes visible again
document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
        if (!wakeLock && !wakeLockVideo) {
            console.log('Tab visible: re-acquiring wake lock');
            await enableWakeLock();
        }
    }
});

// Request on any user interaction (not just first click)
document.addEventListener('click', () => {
    if (!wakeLock && !wakeLockVideo) {
        enableWakeLock();
    }
});

// Initial request
enableWakeLock();

function todayDateTime(timeString) {

    const [hours, minutes] = timeString.split(':');

    const now = new Date();

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        Number(hours),
        Number(minutes),
        0
    );
}

function formatDuration(ms) {

    if (ms < 0) ms = 0;

    const totalSeconds = Math.floor(ms / 1000);

    const hours = Math.floor(totalSeconds / 3600);
    const mins = Math.floor((totalSeconds % 3600) / 60);
    const secs = totalSeconds % 60;

    return `${hours}h ${mins}m ${secs}s`;
}

/* ===== BANDS ===== */

function addBand() {

    const name = document.getElementById('bandName').value.trim();
    const start = document.getElementById('startTime').value;
    const end = document.getElementById('endTime').value;

    if (!name || !start || !end) {
        alert('Please complete all fields');
        return;
    }

    bands.push({
        name,
        start,
        end
    });

    bands.sort((a, b) =>
        a.start.localeCompare(b.start)
    );

    saveBands();
    render();

    document.getElementById('bandName').value = '';
}

function deleteBand(index) {

    if (!confirm('Delete this band?')) {
        return;
    }

    bands.splice(index, 1);

    saveBands();
    render();
}

function editBand(index) {

    const band = bands[index];

    // Find the event in the schedule to get the schedule index
    const schedule = buildSchedule();
    const schedIndex = schedule.findIndex(
        item => item.type === 'band' &&
                item.title === band.name &&
                item.start === band.start
    );

    if (schedIndex === -1) return;

    // Populate edit fields
    document.getElementById(`edit-name-${schedIndex}`).value = band.name;
    document.getElementById(`edit-start-${schedIndex}`).value = band.start;
    document.getElementById(`edit-end-${schedIndex}`).value = band.end;

    // Toggle visibility
    document.getElementById(`event-info-${schedIndex}`).style.display = 'none';
    document.getElementById(`event-edit-${schedIndex}`).style.display = 'block';
}

function saveEdit(schedIndex, bandIndex) {

    const name = document.getElementById(`edit-name-${schedIndex}`).value.trim();
    const start = document.getElementById(`edit-start-${schedIndex}`).value;
    const end = document.getElementById(`edit-end-${schedIndex}`).value;

    if (!name || !start || !end) {
        alert('Please complete all fields');
        return;
    }

    bands[bandIndex].name = name;
    bands[bandIndex].start = start;
    bands[bandIndex].end = end;

    bands.sort((a, b) =>
        a.start.localeCompare(b.start)
    );

    saveBands();
    render();
}

function cancelEdit(schedIndex) {

    document.getElementById(`event-info-${schedIndex}`).style.display = 'block';
    document.getElementById(`event-edit-${schedIndex}`).style.display = 'none';
}

/* ===== SCHEDULE ===== */

function buildSchedule() {

    const schedule = [];

    const sorted = [...bands].sort((a, b) =>
        a.start.localeCompare(b.start)
    );

    for (let i = 0; i < sorted.length; i++) {

        const band = sorted[i];

        schedule.push({
            type: 'band',
            title: band.name,
            start: band.start,
            end: band.end
        });

        const next = sorted[i + 1];

        if (next && band.end < next.start) {

            schedule.push({
                type: 'changeover',
                title: '🔄 CHANGEOVER',
                start: band.end,
                end: next.start
            });
        }
    }

    return schedule;
}

/* ===== RENDER ===== */

function render() {

    const timeline = document.getElementById('timeline');
    timeline.innerHTML = '';

    const schedule = buildSchedule();

    schedule.forEach((item, index) => {

        const div = document.createElement('div');

        div.id = `event-${index}`;

        div.className =
            item.type === 'changeover'
            ? 'event changeover'
            : 'event';

        let actionsHtml = '';

        if (item.type === 'band') {

            const bandIndex = bands.findIndex(
                b => b.name === item.title &&
                     b.start === item.start
            );

            actionsHtml = `
                <div class="event-actions">
                    <button class="edit-btn"
                        onclick="editBand(${bandIndex})">
                        Edit
                    </button>
                    <button class="delete-btn"
                        onclick="deleteBand(${bandIndex})">
                        Delete
                    </button>
                </div>`;
        }

        div.innerHTML = `
            <div class="event-header">

                <div id="event-info-${index}">
                    <div class="title">${item.title}</div>
                    <div class="time">
                        ${item.start} - ${item.end}
                    </div>
                </div>

                <div id="event-edit-${index}" style="display:none;">
                    <div class="edit-fields">
                        <input type="text" id="edit-name-${index}" placeholder="Band Name">
                        <input type="time" id="edit-start-${index}">
                        <input type="time" id="edit-end-${index}">
                        <button class="save-btn"
                            onclick="saveEdit(${index}, ${item.type === 'band' ? bands.findIndex(b => b.name === item.title && b.start === item.start) : -1})">
                            Save
                        </button>
                        <button class="cancel-btn"
                            onclick="cancelEdit(${index})">
                            Cancel
                        </button>
                    </div>
                </div>

                ${actionsHtml}

            </div>

            <div class="countdown"
                 id="countdown-${index}">
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar-fill"
                     id="progress-${index}">
                </div>
            </div>
        `;

        timeline.appendChild(div);
    });

    updateCountdowns();
}

/* ===== CLOCK ===== */

function updateClock() {

    const now = new Date();

    document.getElementById('clock').textContent =
        now.toLocaleTimeString('en-GB');
}

/* ===== COUNTDOWNS ===== */

function updateCountdowns() {

    const now = new Date();

    const schedule = buildSchedule();

    let nextEvent = null;
    let nextRemaining = null;

    document
        .querySelectorAll('.event')
        .forEach(el => el.classList.remove('active'));

    schedule.forEach((item, index) => {

        const start = todayDateTime(item.start);
        const end = todayDateTime(item.end);

        const countdownEl =
            document.getElementById(`countdown-${index}`);

        const progressEl =
            document.getElementById(`progress-${index}`);

        const cards =
            document.querySelectorAll('.event');

        let html = '';
        let progressPct = 0;
        let progressClass = '';

        if (now < start) {

            const diff = start - now;

            html = `
                <span class="status-upcoming">
                    Starts in ${formatDuration(diff)}
                </span>
            `;

            progressPct = 0;
            progressClass = 'upcoming';

            if (!nextRemaining || diff < nextRemaining) {
                nextRemaining = diff;
                nextEvent = item;
            }

        }
        else if (now >= start && now <= end) {

            const diff = end - now;
            const total = end - start;
            const elapsed = now - start;

            html = `
                <span class="status-live">
                    ${item.type === 'changeover'
                        ? 'Ends'
                        : 'Finishes'}
                    in ${formatDuration(diff)}
                </span>
            `;

            progressPct = total > 0
                ? (elapsed / total) * 100
                : 100;
            progressClass = 'live';

            cards[index].classList.add('active');

            if (currentActiveIndex !== index) {

                currentActiveIndex = index;

                const el =
                    document.getElementById(`event-${index}`);

                setTimeout(() => {

                    window.scrollTo({
                        top: el.offsetTop -
                             (window.innerHeight * 0.7),
                        behavior: 'smooth'
                    });

                }, 250);
            }

        }
        else {

            html = `
                <span class="status-ended">
                    Completed
                </span>
            `;

            progressPct = 100;
            progressClass = 'completed';
        }

        countdownEl.innerHTML = html;

        if (progressEl) {
            progressEl.style.width = progressPct.toFixed(1) + '%';
            progressEl.className = 'progress-bar-fill ' + progressClass;
        }
    });

    const banner =
        document.getElementById('nextEvent');

    if (nextEvent) {

        banner.innerHTML =
            `NEXT: ${nextEvent.title}<br>
             <span style="font-size:3em">
             ${formatDuration(nextRemaining)}
             </span>`;
    }
    else {

        const active = schedule.find(item => {

            const start =
                todayDateTime(item.start);

            const end =
                todayDateTime(item.end);

            return now >= start && now <= end;
        });

        if (active) {

            banner.innerHTML =
                `LIVE NOW<br>${active.title}`;
        }
        else {

            banner.innerHTML =
                'No More Events Today';
        }
    }
}

/* ===== START ===== */

render();

updateClock();
updateCountdowns();

setInterval(() => {

    updateClock();
    updateCountdowns();

}, 1000);

</script>

</body>
</html>
