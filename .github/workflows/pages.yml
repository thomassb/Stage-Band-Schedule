name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup GitHub Pages environment
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 3. Prepare static site output
      #    (safe structure for future scaling)
      - name: Build site
        run: |
          rm -rf dist
          mkdir dist

          # Copy main entry file
          cp index.html dist/

          # Copy assets if they exist (non-fatal if missing)
          cp -r *.css dist/ 2>/dev/null || true
          cp -r *.js dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true

          echo "Build complete"

      # 4. Upload artifact for Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 5. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4